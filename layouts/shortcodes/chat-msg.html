{{ $side := .Get "side" | default "left" }}
{{ $name := .Get "name" }}
{{ $color := .Get "color" | default "#6B4CE6" }}

{{ if eq $side "right" }}
<div class="flex justify-end">
  <div style="background:#DCF8C6; max-width:85%;" class="rounded-lg rounded-tr-none px-3 py-2 shadow-sm">
    <p style="color:#1f2937; font-size:0.875rem; margin:0;">{{ .Get "msg" }}</p>
    <p style="color:#9ca3af; font-size:10px; text-align:right; margin:4px 0 0 0;">{{ .Get "time" }}</p>
  </div>
</div>
{{ else }}
<div class="flex justify-start">
  <div style="background:white; max-width:85%;" class="rounded-lg rounded-tl-none px-3 py-2 shadow-sm">
    {{ if $name }}<p style="color:{{ $color }}; font-size:0.75rem; font-weight:600; margin:0 0 4px 0;">{{ $name }}</p>{{ end }}
    <p style="color:#1f2937; font-size:0.875rem; margin:0;">{{ .Get "msg" }}</p>
    <p style="color:#9ca3af; font-size:10px; text-align:right; margin:4px 0 0 0;">{{ .Get "time" }}</p>
  </div>
</div>
{{ end }}
