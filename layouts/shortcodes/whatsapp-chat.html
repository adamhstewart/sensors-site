{{ $group := .Get "group" | default "The Kids" }}
{{ $members := .Get "members" | default "Sarah, David, You" }}
{{ $initials := .Get "initials" | default "TK" }}

<div class="not-prose my-12">
  <div class="max-w-sm mx-auto">
    <div class="rounded-2xl overflow-hidden shadow-2xl border border-gray-200">
      <!-- WhatsApp Header -->
      <div style="background-color: #075E54;" class="px-4 py-3 flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="white" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
        </svg>
        <div style="background-color: #25D366;" class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm">{{ $initials }}</div>
        <div>
          <p class="text-white font-semibold text-sm" style="margin:0;">{{ $group }}</p>
          <p style="color: #a7f3d0; margin:0; font-size:0.75rem;">{{ $members }}</p>
        </div>
      </div>

      <!-- Chat Body -->
      <div style="background-color: #ECE5DD;" class="px-3 py-4 space-y-3">
        {{ .Inner }}
      </div>
    </div>
  </div>
</div>
