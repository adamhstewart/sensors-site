<div class="text-center">
    <img src="{{ .Get `image` | relURL }}" alt="{{ .Get `name` }}" class="w-32 h-32 rounded-full object-cover mx-auto mb-3">
    <h3 class="font-serif text-lg font-semibold text-text-dark mb-1 mt-0 border-none pb-0">{{ .Get `name` }}</h3>
    <p class="font-sans text-sm text-text-muted">{{ .Inner }}</p>
</div>
